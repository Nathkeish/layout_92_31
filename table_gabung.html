<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="table_gabung.css">
    </head>
    <body>
        <h2>Colspan dan Rowspan pada Table</h2>
        <!--colspan : menggabungkan kolom
            rowspan : menggabungkan baris-->
            <table>
                <tr>
                    <th rowspan="2">No</th>
                    <th rowspan="2">Nama</th>
                    <th colspan="2">Nilai</th>
                </tr>
                <tr>
                    <td>Ulangan 1</td>
                    <td>Ulangan 2</td>
                </tr>
                <tr>
                    <td>31</td>
                    <td>Keisha</td>
                    <td>100</td>
                    <td>99</td>
                </tr>
                <tr>
                    <td>22</td>
                    <td>Kathleen</td>
                    <td>100</td>
                    <td>99</td>
                <tr>
                    <td>29</td>
                    <td>Mia</td>
                    <td>100</td>
                    <td>99</td>
                </tr>
                </tr>
            </table>
    </body>
</html>
